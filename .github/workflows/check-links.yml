name: Weekly link report

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: link-report
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.5"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
          prune-cache: true

      - name: Install project
        run: uv sync --locked

      - name: Retrieve previous report
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          mkdir -p reports previous
          if ! run_id=$(gh api --method GET \
            "repos/$GITHUB_REPOSITORY/actions/workflows/check-links.yml/runs" \
            -f status=success -f branch="$DEFAULT_BRANCH" -f per_page=1 \
            --jq '.workflow_runs[0].id // empty'); then
            echo "::warning::Could not retrieve report history; failures will be uncompared."
            echo "Previous report history unavailable; failures are uncompared." >> "$GITHUB_STEP_SUMMARY"
          elif [ -z "$run_id" ]; then
            echo "No previous successful report; this run establishes a baseline." >> "$GITHUB_STEP_SUMMARY"
          elif ! gh run download "$run_id" --repo "$GITHUB_REPOSITORY" \
            --name link-check-reports --dir previous; then
            echo "::warning::Previous report artifact unavailable; failures will be uncompared."
            echo "Previous report artifact unavailable; failures are uncompared." >> "$GITHUB_STEP_SUMMARY"
            rm -f previous/municipalities.json previous/school-municipalities.json
          fi

      - name: Check both directories
        run: |
          exit_code=0
          for dataset in municipalities school-municipalities; do
            config=config.yaml
            if [ "$dataset" = school-municipalities ]; then
              config=config.schulgemeinden.yaml
            fi
            args=(--config "$config" --report "reports/$dataset.json" --summary "reports/$dataset.md")
            if [ -f "previous/$dataset.json" ]; then
              args+=(--previous-report "previous/$dataset.json")
            fi
            status=0
            uv run --no-sync check-links "${args[@]}" || status=$?
            if [ "$status" -gt 1 ]; then
              exit_code=$status
            fi
            if [ -f "reports/$dataset.md" ]; then
              printf '\n### %s\n\n' "$dataset" >> "$GITHUB_STEP_SUMMARY"
              cat "reports/$dataset.md" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          exit "$exit_code"

      - name: Save link reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: link-check-reports
          path: reports/
          if-no-files-found: error
          retention-days: 90
